    <!-- GitHub Pages SPA redirect decoder: restores the deep-link path that
         404.html encoded into the query string, before React Router boots. -->
    <script>
      (function () {
        var l = window.location;
        var q = l.search;
        if (q && q.charAt(1) === '/') {
          var decoded = q
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>


    <!-- Primary Meta Tags -->

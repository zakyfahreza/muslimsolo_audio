name = "muslimsolo-r2-presign"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Public, non-secret vars. Set these to your values.
[vars]
R2_ACCOUNT_ID = "your-cloudflare-account-id"
R2_BUCKET = "muslimsolo-audio"
AUDIO_PUBLIC_BASE = "https://audio.muslimsolo.id"
GITHUB_REPO = "your-org/muslimsolo_audio"
ALLOWED_ORIGINS = "https://your-org.github.io,http://localhost:5173,http://localhost:4173"

# Secrets — DO NOT put real values here. Set them with:
#   npx wrangler secret put R2_ACCESS_KEY_ID
#   npx wrangler secret put R2_SECRET_ACCESS_KEY
# Create an R2 API token (Account > R2 > Manage API Tokens) with
# Object Read & Write on the bucket to obtain these.

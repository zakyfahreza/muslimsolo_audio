<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Muslimsolo Audio</title>
    <script>
      // Single Page App fallback for GitHub Pages.
      // Redirects deep links (e.g. /muslimsolo_audio/kajian/123) to index.html
      // while preserving the path so React Router can take over.
      // Set to 1 for a project site served from https://user.github.io/<repo>/.
      // Set to 0 for a custom domain / user site served from the root.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
